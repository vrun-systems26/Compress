
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compress</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {background: #f3f0e8; color: #202b35; font-family: 'DM Sans', sans-serif;}
    main.container {max-width: 760px; text-align: center; padding-top: 35px;}
    h1, h2 {font-family: 'Playfair Display', serif;}
    h1 {font-size: 3.5rem; margin-bottom: 8px; color: #172d42;}
    .subtitle {color: #65717b; margin-bottom: 24px;}
    #canvas {width: 100%; max-width: 560px; height: auto; border: 5px solid white; border-radius: 12px; background: #dce3e7; box-shadow: 0 8px 24px #172d421c;}
    #status {background: white; padding: 18px; border-radius: 10px; color: #172d42; margin-top: 20px;}
    #label-container {font-size: 0.85rem; color: #65717b;}
    .actions {display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;}
    .start {background: #203d55; border-color: #203d55;}
    .emergency {background: #b52f35; border-color: #b52f35;}
    .note {font-size: 0.8rem; color: #65717b; margin-top: 24px;}
  </style>
</head>
<body>
<main class="container">

<h1>Compress</h1>
<p class="subtitle">Stay focused. Keep helping. Every second matters.</p>

<div class="actions">
<button type="button" class="start" onclick="init()">Start Camera</button>
<a href="tel:911" role="button" class="emergency">Call 911</a>
</div>

<div style="margin-top: 24px;">
<canvas id="canvas" width="400" height="400"></canvas>
</div>

<div id="label-container"></div>
<h2 id="status">Press Start Camera</h2>
<p class="note">Student project prototype. In an emergency, call 911 and follow the dispatcher's instructions.</p>

</main>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
<script type="text/javascript">
    const URL = "./";
    let model, webcam, ctx, labelContainer, maxPredictions;

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const size = 400;
        const flip = true;
        webcam = new tmPose.Webcam(size, size, flip);
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loop);

        const canvas = document.getElementById("canvas");
        canvas.width = size; canvas.height = size;
        ctx = canvas.getContext("2d");
        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
            labelContainer.appendChild(document.createElement("div"));
        }
        document.getElementById("status").textContent = "Camera ready";
    }

    async function loop(timestamp) {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
        const prediction = await model.predict(posenetOutput);
        for (let i = 0; i < maxPredictions; i++) {
            const classPrediction =
                prediction[i].className + ": " + prediction[i].probability.toFixed(2);
            labelContainer.childNodes[i].textContent = classPrediction;
        }

        let best = prediction[0];
        for (let i = 1; i < maxPredictions; i++) {
            if (prediction[i].probability > best.probability) {
                best = prediction[i];
            }
        }

        if (best.probability > 0.8) {
            const status = document.getElementById("status");
            if (best.className === "Good Form") {
                status.textContent = "Good, keep going";
            } else if (best.className === "Bent Elbows") {
                status.textContent = "Lock your elbows";
            } else if (best.className === "Hands Off") {
                status.textContent = "Keep pushing!";
            } else if (best.className === "Not in View") {
                status.textContent = "Move the phone back";
            } else if (best.className === "Giving Breaths") {
                status.textContent = "Giving breaths…";
            }
        }
        drawPose(pose);
    }

    function drawPose(pose) {
        if (webcam.canvas) {
            ctx.drawImage(webcam.canvas, 0, 0);
            if (pose) {
                const minPartConfidence = 0.5;
                tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
            }
        }
    }
</script>
</body>
</html>
